<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- The page's frame in miniature: a square whose sides run past each
       corner, so every corner carries a registration cross. One weight
       throughout. -->
  <rect width="32" height="32" fill="#ffffff" />
  <g fill="#0a0a0a">
    <rect x="3" y="7" width="26" height="2" />
    <rect x="3" y="23" width="26" height="2" />
    <rect x="7" y="3" width="2" height="26" />
    <rect x="23" y="3" width="2" height="26" />
  </g>
</svg>
